name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        # Pinned to match the version developers run locally so CI and local
        # results stay identical. Bump in lockstep with the local install.
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.7.2

      - name: go mod tidy is clean
        run: go mod tidy && git diff --exit-code

      - name: test
        run: go test ./...

      - name: test -race
        run: go test -race ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
