# resticscope configuration — copy to ~/.config/resticscope/config.toml and edit.
#
# Declares which repos exist and what's expected of each. Holds NO secrets:
# backend credentials and restic passwords come from secrets_command at runtime
# (see [global].secrets_command below).
# Commented entries show defaults.

# --- global -------------------------------------------------------------------
[global]
secrets_command = "pass show resticscope/credentials"

# parallelism = 4
# cache_dir = "~/.cache/resticscope"
# refresh_on_open = true
# stale_after = "10m"
# stale_grace = "12h"
# shell = ""
# shell_password_mode = "file" # file | env
# group_by = []

# --- browse -------------------------------------------------------------------
[browse]
# index_timeout = "10m"
# max_disk_bytes = "2GiB" # "0" = unlimited

# --- extract ------------------------------------------------------------------
[extract]
# target_root = "~/resticscope-extracts"
# extract_timeout = "30m"
# unsafe_symlinks = "keep" # keep | skip | placeholder
# remember_target = true

# --- theme --------------------------------------------------------------------
[theme]
# name = "gruvbox-dark"
# background = true

# --- repository profiles ------------------------------------------------------
# Shared repo settings; repos opt in e.g. with `profile = "hetzner-fsn1"`.

[profiles.hetzner-fsn1]
credential = "hetzner-home"
endpoint = "https://fsn1.your-objectstorage.com"
region = "fsn1"
expected_frequency = "24h"
labels = { env = "home", category = "personal" }

[profiles.hetzner-hel1]
credential = "hetzner-home"
endpoint = "https://hel1.your-objectstorage.com"
region = "hel1"
expected_frequency = "24h"
labels = { env = "home", category = "work" }

# --- repositories -------------------------------------------------------------
# The table suffix is the repo name and must match a "repos" key in secrets JSON.
# Use either `url` or S3 shorthand (`endpoint` + `bucket`, with optional `path`).

[repos.homeserver-system]
profile = "hetzner-fsn1"
description = "Daily system backup of homeserver"
bucket = "homeserver-backups"
labels = { criticality = "high" }

[repos.laptop-restic]
profile = "hetzner-hel1"
description = "Laptop backup in Helsinki"
bucket = "laptop-backups"
labels = { criticality = "medium" }

[repos.nas-offsite]
description = "NAS offsite copy"
credential = "nas-b2"
url = "b2:nas-backups:repo"
expected_frequency = "168h"
labels = { env = "home", criticality = "high", category = "offsite" }

[repos.nas-sftp]
description = "Direct NAS repo over ssh"
url = "sftp:backup@nas:/srv/restic-repo"
options = { "sftp.command" = "ssh backup@nas -i /home/me/.ssh/backup_ed25519 -s sftp" }
expected_frequency = "24h"
labels = { env = "home", criticality = "medium", category = "personal" }

[repos.usb-archive]
url = "/mnt/archive/restic-repo"
expected_frequency = "720h"
