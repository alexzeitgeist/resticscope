# resticscope configuration — copy to ~/.config/resticscope/config.toml and edit.
#
# This file describes which repos exist and what is expected of them. It holds
# NO secrets: S3 keys and restic passwords come from secrets_command at runtime
# (see [global].secrets_command below).

[global]
# secrets_command prints a single JSON document with your S3 keys and restic
# passwords to stdout. It is run through $SHELL -c, so pipes and flags work.
# For local development point it at a plaintext file; for real use point it at
# a secret manager (pass, age, SOPS, 1Password).
secrets_command = "pass show resticscope/credentials"

parallelism         = 4                       # max concurrent restic processes (Hetzner throttles; keep <= 4)
cache_dir           = "~/.cache/resticscope"  # per-repo state JSON + restic's own cache live here
refresh_on_open     = true                    # auto-refresh stale entries when the TUI launches
stale_after         = "10m"                   # cache entries older than this are refreshed on open
stale_grace         = "12h"                   # amber band added on top of each repo's expected_frequency
shell               = ""                       # empty -> use $SHELL for the snapshot-browsing shell
shell_password_mode = "file"                  # file = 0600 temp + RESTIC_PASSWORD_FILE (default); env = RESTIC_PASSWORD
# group_by         = ["env", "region"]      # optional: repo label keys; press `g` to cycle through them and a flat view

# --- in-app file browser ------------------------------------------------------
# Press `b` on a snapshot to browse its files in-app. The first time a snapshot
# is browsed, one streamed `restic ls --recursive` indexes its whole namespace
# into a session-scoped SQLite database, encrypted at rest under a random 32-byte
# key that lives ONLY in memory (never derived from the repo password, never
# written anywhere). All later navigation is served from that database, so it is
# always complete — no truncation, no "load more". The DB is created lazily on
# the first browse and deleted on clean exit; a crash leftover is unreadable
# because the key is gone, and is scavenged by conservative startup cleanup. This
# whole block is optional; the defaults below apply when it is omitted.
[browse]
index_timeout = "10m"   # cap the one-time full index of a snapshot (generous: huge snapshots take minutes)
max_disk_bytes = "2GiB" # session-wide ceiling on the encrypted browse dir; "0" = unlimited

# --- extracting files out of a backup -----------------------------------------
# Press `e` on a browsed file or directory to extract it to the local filesystem.
# resticscope never modifies the repository: it spawns one read-only
# `restic --no-lock restore --overwrite never` (a single file is selected with
# --include). Output is a pure mirror tree: a file or directory lands at its true
# path under <target_root>/<repo-slug>/<snapshot-short>/, e.g. /etc/hosts ->
# .../<short>/etc/hosts. There is no layout toggle. Extracts from one snapshot
# share the <short>/ dir and reuse ancestor dirs; the merge only fills empty space,
# so resticscope refuses any extract whose exact target is already occupied (it
# never overwrites or merges into existing output). Every extract — file or
# directory — publishes a faithful, verbatim copy of what restic restored: original
# modes, mtimes, xattrs/ACLs, and ownership are all preserved (a single file keeps
# its snapshot metadata too, not the old 0600/now). resticscope only ever acts on
# "unsafe" symlinks (see unsafe_symlinks below); special files and unsafe links are
# counted, never fatal. This block is optional; the defaults below apply when it is
# omitted. An extract publishes only on Linux/macOS; on other platforms it is
# refused before restic runs.
[extract]
# Base directory for extract output. Each extract mirrors its source to its true
# path under <target_root>/<repo-slug>/<snapshot-short>/, reusing ancestor dirs and
# refusing any target that is already occupied. ~ is expanded to the user's home
# directory.
target_root = "~/resticscope-extracts"

# Hard cap on a single extract operation. Exceeding the cap
# cancels the operation and leaves the partial staging dir in place for the user
# to keep or delete.
extract_timeout = "30m"

# What to do with a restored symlink whose target is absolute or escapes the
# extracted tree (and so would alias your LIVE filesystem once the fragment is in
# a scratch dir):
#   "keep"        - leave it verbatim and warn (default; matches restic)
#   "skip"        - remove the unsafe link from the output
#   "placeholder" - replace it with an inert text file recording the target
# Targets that stay inside the extracted tree are always kept. resticscope never
# follows an unsafe link.
unsafe_symlinks = "keep"

# --- S3 credentials -----------------------------------------------------------
# A credential is just a NAME for an access-key/secret-key pair; it carries no
# location. On Hetzner one project key pair reaches every bucket in the project,
# including buckets in different regions, so endpoint/region/bucket_lookup live
# on each repo (below), not here. Each name must be unique and match a key under
# "credentials" in the secrets JSON.

[[credentials]]
name = "hetzner-home"

# --- repositories -------------------------------------------------------------
# Each repo references a credential by name and describes where its bucket lives:
# endpoint (required), plus the optional region and bucket_lookup. The name must
# be unique, match a key under "repos" in the secrets JSON, and contain only
# letters, digits, '.', '_' and '-' (it becomes a cache filename). The name is
# also resticscope's local identity for the repo: its status/history JSON and
# its restic cache are both keyed on it, so renaming a repo here looks like a
# new repo to the local tool — the next refresh rebuilds restic's cache from
# scratch and leaves the old cache dir orphaned. Run `resticscope cache prune`
# after renaming or removing a repo to reclaim that space. The two repos below
# share one credential while living in different regions.

[[repos]]
name               = "homeserver-system"
description        = "Daily system backup of homeserver"
credential         = "hetzner-home"
endpoint           = "https://fsn1.your-objectstorage.com"
region             = "fsn1"
bucket             = "homeserver-backups"
path               = ""                         # optional sub-prefix within the bucket
bucket_lookup      = "auto"                     # auto | dns | path (use dns only if a bucket requires it)
expected_frequency = "24h"                      # older than this (+ stale_grace) turns the repo amber/red
labels             = { env = "home", criticality = "high", category = "personal" }

# region, path, and bucket_lookup are all optional — omitted here. The endpoint
# host implies the region, path defaults to the bucket root, bucket_lookup to
# "auto". Same credential as above, different region.
[[repos]]
name               = "laptop-restic"
description        = "Laptop backup in Helsinki"
credential         = "hetzner-home"
endpoint           = "https://hel1.your-objectstorage.com"
bucket             = "laptop-backups"
expected_frequency = "24h"
labels             = { env = "home", criticality = "medium", category = "personal" }
