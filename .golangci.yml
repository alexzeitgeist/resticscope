version: "2"
run:
  concurrency: 4
  timeout: 5m
  tests: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 50

linters:
  enable:
    # correctness
    - govet            # built-in checker: copylocks, printf formats, struct tags, unreachable code
    - staticcheck      # extensive static analysis: deprecated APIs, common mistakes, simplifications
    - unused           # unused variables, functions, types
    - errcheck         # unchecked error returns and type assertions
    - errorlint        # correct use of errors.Is/As and %w wrapping (Go 1.13+)
    - nilerr           # returning nil error when err is non-nil
    - forcetypeassert  # type assertions without comma-ok check
    - copyloopvar      # loop variable copy issues (Go 1.22+)
    - durationcheck    # detect time.Duration * time.Duration bugs
    - reassign         # package-level variable reassignment
    # style
    - gocritic         # opinionated style: unnecessary conversions, range copies, redundant code
    - revive           # naming conventions, exported types, stuttered package names
    - whitespace       # trailing whitespace, unnecessary blank lines
    - godot            # exported-symbol comments must end with a period
    - misspell         # common English misspellings in identifiers and comments
    - predeclared      # shadowing Go built-ins (len, cap, error)
    # NOTE: dupword is intentionally NOT enabled. This codebase embeds generated
    # shell scaffolding (fish/zsh/bash) in raw string literals where keywords
    # legitimately repeat (fish closes both `if` and `function` with `end`), and
    # dupword's autofix DELETES the "duplicate", corrupting the script. The risk
    # of its --fix outweighs catching "the the"-style typos.
    - errname          # error type/var naming conventions (ErrFoo, FooError)
    - asciicheck       # non-ASCII identifiers (prevents homoglyph/trojan source attacks)
    # complexity
    - gocyclo          # cyclomatic complexity threshold
    - nestif           # deeply nested if/else chains
    - funlen           # function length limits (lines and statements)
    # performance
    - perfsprint       # faster alternatives to fmt.Sprintf
    - unconvert        # unnecessary type conversions
    - ineffassign      # assignments to variables never read
    - goconst          # repeated literals that should be constants
    # security & resources
    - gosec            # security scanner: SQL injection, hardcoded credentials, weak crypto, path traversal
    - bidichk          # dangerous bidirectional Unicode sequences (trojan source CVE-2021-42574)
    - sqlclosecheck    # unclosed sql.Rows and sql.Stmt
    - rowserrcheck     # unchecked sql.Rows.Err() after iteration
    # testing
    - testifylint      # testify best practices
    - thelper          # test helpers missing t.Helper()
    - usetesting       # use t.Setenv/t.TempDir instead of os equivalents in tests
    # modernization & meta
    - modernize        # old patterns replaceable with newer Go features
    - exptostd         # replace golang.org/x/exp/ functions with stdlib equivalents
    - intrange         # range over integer instead of C-style loop (Go 1.22+)
    - usestdlibvars    # use stdlib constants instead of hardcoded values
    - nolintlint       # enforces proper //nolint directive usage

  exclusions:
    paths:
      - upstream  # nested module: vendored restic reference source, not ours to lint
      - vendor$
    rules:
      # In tests, a type assertion that panics on the wrong type is an
      # intentional, loud failure; production code is held to comma-ok.
      # gosec on tests is noise: fixtures use relaxed file perms, temp-path
      # variables, and hardcoded sample credentials by design. gocyclo/funlen
      # on tests is noise too: table-driven tests are branchy and long by
      # nature, which is not a code-quality signal. goconst on tests likewise:
      # fixtures deliberately repeat repo names and paths inline, where a shared
      # constant would hurt readability rather than help it.
      - path: _test\.go
        linters:
          - forcetypeassert
          - gosec
          - gocyclo
          - funlen
          - goconst
      # revive unused-parameter: a deliberate, repo-wide disable of a
      # high-false-positive rule. In Go an unused parameter is overwhelmingly
      # intentional — interface/callback conformance (bubbletea handlers, tea.Cmd
      # closures, command/runner signatures) — and the hits span app, resticx,
      # cmd, tui, and secrets, not one layer, so path-scoping would not be
      # honest. revive's remedy (rename to _) costs more in lost parameter-name
      # documentation than it buys. TRADE-OFF: a genuinely forgotten parameter
      # also goes unflagged; that is accepted as low-severity.
      - linters: [revive]
        text: "^unused-parameter:"
      # revive redefines-builtin-id: a pure duplicate of predeclared, which is
      # enabled and remains the ACTIVE guard — predeclared.ignore lists only
      # cap/min/max, so dangerous shadows (len, error, copy, append, new, delete)
      # are still caught. Every current revive hit is a local named cap/min/max
      # (min/max became builtins only in Go 1.21); this exclusion just suppresses
      # revive's redundant copy of those, leaving predeclared as the single guard.
      - linters: [revive]
        text: "^redefines-builtin-id:"
      # revive context-as-argument: SCOPED, not repo-wide, so "context first"
      # stays enforced everywhere else. The only deliberate exceptions are the
      # two extract constructors that take the *app.App handle first
      # (newExtractModel/newExtractDiffModel) and test helpers that take
      # *testing.T first. revive's allowTypesBefore argument can't be set without
      # replacing revive's entire default rule set, so the exception is a path
      # scope instead.
      - path: (_test\.go|internal/tui/extract\.go)
        linters: [revive]
        text: "^context-as-argument:"
      # goconst 1.9 widened detection to literals inside composite literals and
      # case clauses, which is exactly where this codebase keeps presentation
      # and dispatch text: table headers and help rows (tui), command names in
      # the dispatch switch (cmd), restic argv tokens and operation labels
      # (resticx), and config enum values (config, theme). Every hit there is
      # one member of a homogeneous group — {last: "Last", snaps: "Snaps",
      # took: "Took"}, []string{"--no-lock", "find", "--json", "--long"} — so
      # hoisting just the recurring member splits the group across a constant
      # and its literal neighbours and reads worse than the repetition does.
      # goconst stays ACTIVE everywhere else (app, browsedb, cache, secrets,
      # model, humanize), where a repeated literal is still a real smell.
      - path: (^cmd/|^internal/(tui|resticx|config|theme)/)
        linters: [goconst]

  settings:
    errcheck:
      # Type-assertion safety is covered by forcetypeassert for production code;
      # in tests a panicking assertion is an intentional, loud failure.
      check-type-assertions: false
      exclude-functions:
        # CLI output to stdout/stderr/tabwriter: a write error there is
        # unactionable (nowhere left to report it) in this local TUI/CLI tool.
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        # Read-side cursor close in a query path; rows.Err() is checked separately
        # (enforced by rowserrcheck).
        - (*database/sql.Rows).Close
    funlen:
      lines: 120
      statements: 80
    goconst:
      min-len: 3
      min-occurrences: 4
    gocyclo:
      # 30 is golangci-lint's own default. This TUI's bubbletea message
      # dispatchers and key handlers are branchy by nature; a threshold of 15
      # flagged a dozen of them with no real quality signal. The two genuine
      # outliers that remain (Model.Update, PlanExtractPaths) carry a targeted
      # nolint with a justification.
      min-complexity: 30
    predeclared:
      # Allow the pervasive, benign convention of locals named cap/min/max
      # (min/max only became builtins in Go 1.21). predeclared still flags the
      # dangerous shadows — len, error, copy, append, new, delete — in new code.
      ignore:
        - cap
        - min
        - max
    nolintlint:
      require-explanation: true
      require-specific: true
    usetesting:
      # Prefer t.Context() over context.Background()/TODO() in tests: it is
      # cancelled at test cleanup, so a hung call under test cannot outlive the
      # test. Deliberate never-cancel / pre-cancel cases carry a scoped nolint.
      context-background: true
      context-todo: true

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports  # keeps local (resticscope) imports in a separate group from stdlib
  settings:
    goimports:
      local-prefixes:
        - github.com/alexzeitgeist/resticscope
    gofumpt:
      # Tells gofumpt which imports belong to this module so it keeps them in
      # their own group rather than folding them in with third-party ones —
      # matching the goimports local-prefixes above.
      module-path: github.com/alexzeitgeist/resticscope
      extra-rules: true
  exclusions:
    generated: lax
    paths:
      - upstream
