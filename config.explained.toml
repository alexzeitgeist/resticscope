# resticscope configuration, with a comment on every setting.
#
# Copy this to ~/.config/resticscope/config.toml for a guided start, or use
# config.example.toml for a shorter template. Full reference: docs/.
#
# resticscope watches restic repositories that already exist. It does not run
# your backups; cron, systemd timers, Proxmox hooks, NAS tasks, and your own
# scripts still do that. This file declares:
#
#   1. which repositories exist,
#   2. how often each should receive a new snapshot,
#   3. how to obtain the secrets needed to read them,
#   4. how the TUI groups, browses, diffs, and extracts.
#
# It contains no passwords, access keys, or repository passwords. Those are
# loaded at runtime by secrets_command.

# --- terms used below ---------------------------------------------------------
#
# Repository
#   One restic repository you want to watch: local, SFTP, S3-compatible, B2,
#   Azure, GCS, Swift, REST, or rclone.
#
# expected_frequency
#   How often you expect that repository to get a fresh snapshot. Nightly
#   backups use "24h"; a USB disk plugged in monthly uses "720h". This drives
#   the green/amber/red status. Required for every repository.
#
# Credential
#   A name for backend login secrets, not for the repository itself.
#   "hetzner-home" might be one S3 access key pair, "nas-b2" one Backblaze B2
#   account id and key. The values live in the secrets JSON. Local disks, and
#   SFTP using your ssh config or agent, need no credential.
#
# Repository password
#   Separate from the backend credential. Every repository needs a
#   restic_password under "repos.<name>" in the secrets JSON.
#
# Profile
#   Optional. Repeated settings go in [profiles.<name>]; repositories inherit
#   them with profile = "...".
#
# Label
#   Your own key/value tag on a repository. Used for filtering (`/`) and
#   grouping (`g`) in the TUI.

# --- global -------------------------------------------------------------------

[global]
# Required. Must print one JSON document to standard output, holding the backend
# credentials and each repository's password. It runs through your shell, so
# pass, gpg, age, SOPS, 1Password, or a plain cat all work. Exact schema and
# more examples: docs/secrets.md.
#
#   pass show resticscope/credentials
#   gpg -d ~/.config/resticscope/secrets.json.gpg
#   op read 'op://Private/resticscope/credentials'
#   cat ~/.config/resticscope/secrets.json
secrets_command = "pass show resticscope/credentials"

# How many restic commands may run at once while refreshing several
# repositories. Raise it only if your backend and link can take the traffic.
parallelism = 4

# Local state: status cache, operation log, restic's own cache, and the
# temporary browse index. No secrets are written here.
cache_dir = "~/.cache/resticscope"

# Operation log. Omit to keep it under cache_dir.
# log_file = "~/.cache/resticscope/log.jsonl"

# Start with cached status and refresh stale or never-seen repositories in the
# background. Set false to refresh only when you press `r` or `R`.
refresh_on_open = true

# Cached status older than this counts as stale. It is still shown immediately,
# marked with `*`, and refresh_on_open queues a live refresh for it.
stale_after = "10m"

# Slack added to each repository's expected_frequency before it turns red. With
# expected_frequency = "24h" and stale_grace = "12h":
#
#   last snapshot within 24h    green
#   between 24h and 36h         amber
#   beyond 36h                  red
stale_grace = "12h"

# A repository lock older than this turns the repository red: a backup, prune,
# or check may have died while holding it.
lock_max_age = "30m"

# Timeout for secrets_command. Raise it if your secret store is slow to unlock.
secrets_command_timeout = "30s"

# Timeout for short restic calls, such as reading the snapshot list. Long
# operations have their own: browse.index_timeout, diff.timeout,
# extract.extract_timeout.
restic_command_timeout = "2m"

# Shell used for secrets_command and for `s` in the TUI / `resticscope exec`.
# Empty means $SHELL, falling back to /bin/sh.
shell = ""

# How the repository password reaches an interactive shell.
#   "file"  a temporary 0600 RESTIC_PASSWORD_FILE, deleted when it ends
#   "env"   RESTIC_PASSWORD in the environment
shell_password_mode = "file"

# Label keys the main list can group by. `g` cycles them in this order and then
# a flat list. Leave empty to disable grouping.
#
#   group_by = ["env", "region", "criticality"]   # several machines
#   group_by = ["category", "device"]             # one household
group_by = ["env", "category"]

# --- browse -------------------------------------------------------------------
# `b` on a snapshot browses its files. The first browse indexes the snapshot's
# whole file list into a temporary encrypted database under cache_dir; after
# that, navigation is instant and complete. The index is deleted on a clean
# exit, and a file left by a crash is unreadable because its key only ever
# existed in memory. Details: docs/browsing.md.

[browse]
# Time limit for indexing one snapshot. Large file servers and photo archives
# may need more.
index_timeout = "10m"

# Disk limit for the index across the whole session, not per snapshot. "0" means
# unlimited. Keep it bounded on a small laptop or VPS.
max_disk_bytes = "2GiB"

# --- diff ---------------------------------------------------------------------
# Mark two snapshots with `t` and press `d` to compare them.

[diff]
# Comparing large trees can take minutes, so diff does not use the shorter
# global.restic_command_timeout.
timeout = "10m"

# --- extract ------------------------------------------------------------------
# `e` copies a file, a directory, or a whole snapshot out of a backup. The
# repository is only ever read: restic restore runs with overwrite protection
# and no lock, and output goes under target_root:
#
#   <target_root>/<repository>/<snapshot>/<original path>
#
# Extracting /etc/hosts from snapshot abc12345 of homeserver-system lands in
# ~/resticscope-extracts/homeserver-system/abc12345/etc/hosts.
#
# Press `p` on the review screen to extract as root, which preserves the
# snapshot's own owners and groups. Details: docs/extract.md.

[extract]
# Base directory for extracted files. Use a scratch area, not your live home
# directory, so restored copies cannot be mistaken for current data.
target_root = "~/resticscope-extracts"

# Time limit for one extract. Raise it for very large directories.
extract_timeout = "30m"

# What to do with a restored symlink whose target is absolute or points outside
# the extracted tree, and would therefore alias your live filesystem:
#
#   "keep"          leave it as restic restored it, and report the count
#   "skip"          remove it from the output
#   "placeholder"   replace it with a text file naming the original target
#
# Links that stay inside the extracted tree are always kept, and resticscope
# never follows an unsafe one.
unsafe_symlinks = "keep"

# Reuse the target directory of the last extract for the rest of the session.
# Nothing is written to disk; the next start begins at target_root again.
remember_target = true

# --- theme --------------------------------------------------------------------
# All themes are compiled into the binary; there are no files to install.
# Details: docs/themes.md.

[theme]
# One of:
#   ayu-dark, ayu-light, catppuccin-frappe, catppuccin-latte,
#   catppuccin-macchiato, catppuccin-mocha, dracula, gruvbox-dark,
#   gruvbox-light, monokai, night-owl, night-owl-light, nord, one-dark,
#   solarized-dark, solarized-light, terminal, tokyo-night
#
# Use "terminal" to follow your terminal's own colors.
name = "gruvbox-dark"

# Paint the terminal background with the theme while the TUI runs. Set false to
# keep your own background, for transparency or an already-matching scheme.
background = true

# Optional per-role overrides on top of the chosen theme. Values are "#rgb",
# "#rrggbb", an ANSI-256 number "0".."255", or "default".
#
#   bg      terminal background        green   ok states, added paths
#   fg      normal text                yellow  titles, modified paths
#   grey    metadata                   blue    headings, directories
#   dim     separators, disabled text  aqua    labels, symlinks, spinner
#   red     errors, removed paths      orange  cursor, key hints, bitrot
#
# [theme.colors]
# orange = "#d65d0e"
# grey   = "245"

# --- profiles -----------------------------------------------------------------
# Settings shared by several repositories. The two below are two Hetzner object
# storage regions: same credential, different endpoints and labels.
#
# A repository's own value replaces the profile's, but cannot clear it. labels,
# env, and options are merged key by key, with the repository winning.

[profiles.hetzner-fsn1]
credential         = "hetzner-home"
endpoint           = "https://fsn1.your-objectstorage.com"
region             = "fsn1"
expected_frequency = "24h"
labels             = { env = "home", category = "personal" }

[profiles.hetzner-hel1]
credential         = "hetzner-home"
endpoint           = "https://hel1.your-objectstorage.com"
region             = "hel1"
expected_frequency = "24h"
labels             = { env = "home", category = "work" }

# --- repositories -------------------------------------------------------------
# Each [repos.<name>] table is one repository, and the table name is how
# resticscope identifies it. So [repos.homeserver-system] is the repository
# "homeserver-system". The name must:
#
#   - be unique,
#   - use only letters, digits, ".", "_", and "-",
#   - match a key under "repos" in the secrets JSON,
#   - stay stable to keep that repository's local cache and history.
#
# Quote the header if the name itself contains a dot: [repos."host.daily"]
#
# Give the location in exactly one of two ways:
#
#   1. endpoint + bucket, with optional region, path, and bucket_lookup.
#      Convenient for Hetzner, MinIO, AWS S3, and similar stores.
#
#   2. url, the restic repository string verbatim, for any other backend:
#        /srv/restic-repo
#        sftp:user@host:/srv/restic-repo
#        rest:https://host:8000/repo
#        s3:https://host/bucket
#        b2:bucket:path
#        azure:container:/
#        gs:bucket:/
#        swift:container:/
#        rclone:remote:path
#
# Optional for any repository:
#   credential   backend secret name from the secrets JSON
#   env          non-secret backend environment variables
#   options      restic backend options, passed as -o key=value
#   labels       free-form tags for filtering and grouping
#
# Backend secrets belong in the credential, not in env: resticscope rejects env
# names it manages itself, such as RESTIC_REPOSITORY and RESTIC_PASSWORD.

# A homeserver in S3-compatible storage. Everything but the bucket and the extra
# label comes from the profile.
[repos.homeserver-system]
profile = "hetzner-fsn1"
bucket  = "homeserver-backups"
# path  = "restic"   # optional prefix inside the bucket; omitted = bucket root
labels  = { criticality = "high", device = "homeserver" }

# A laptop, in the second region.
[repos.laptop-restic]
profile = "hetzner-hel1"
bucket  = "laptop-backups"
labels  = { criticality = "medium", device = "laptop" }

# Backblaze B2, written as a restic URL. The "nas-b2" credential must exist in
# the secrets JSON, and usually holds B2_ACCOUNT_ID and B2_ACCOUNT_KEY.
[repos.nas-offsite]
url                = "b2:nas-backups:repo"
credential         = "nas-b2"
expected_frequency = "168h"
labels             = { env = "home", criticality = "high", category = "offsite", device = "nas" }

# SFTP. No credential, because ssh authenticates through your config, keys, or
# agent. options are passed to restic as -o values.
[repos.nas-sftp]
url                = "sftp:backup@nas:/srv/restic-repo"
options            = { "sftp.command" = "ssh backup@nas -i /home/me/.ssh/backup_ed25519 -s sftp" }
expected_frequency = "24h"
labels             = { env = "home", criticality = "medium", category = "personal", device = "nas" }

# A local disk that is only connected occasionally, so it is not late until a
# month has passed.
[repos.usb-archive]
url                = "/mnt/archive/restic-repo"
expected_frequency = "720h"
labels             = { env = "home", criticality = "low", category = "archive", device = "usb" }
